AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume Backend (Lambda + API Gateway + DynamoDB)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10

Resources:
  # --- Data layer ---
  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Optional to name the table; using Ref elsewhere protects you from renames
      TableName: visitorCount
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # --- Ingress layer ---
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins:
          - https://ron-mercier101.com
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-requested-with
          - x-api-key
        AllowMethods:
          - GET
          - OPTIONS
        MaxAge: 3600
      # --- Rate limiting ---
      # ThrottlingRateLimit:  sustained requests/sec allowed (token bucket refill rate)
      # ThrottlingBurstLimit: maximum concurrent requests at any instant
      # At normal portfolio traffic these limits will never be hit.
      # They cap runaway abuse before it inflates Lambda/DynamoDB costs.
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  # --- Logic layer ---
  VisitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: visitor-counter-lambda
      CodeUri: src/
      Handler: app.lambda_handler
      # --- Concurrency cap ---
      # Limits simultaneous Lambda executions as a second layer of defence.
      # 10 concurrent executions is well above any realistic portfolio load.
      # Without this, a burst that exceeds the API Gateway throttle could
      # still spin up many Lambdas before the throttle responds.
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitorTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /count
            Method: GET

Outputs:
  ApiEndpoint:
    Description: HTTPS endpoint for the Visitor Counter API (GET /count)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/count'
  TableName:
    Description: DynamoDB table name
    Value: !Ref VisitorTable
  FunctionName:
    Description: Lambda function name
    Value: !Ref VisitorFunction
